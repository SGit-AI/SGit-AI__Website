# Deploys the sgit.ai site (this repo's working tree) to GitHub Pages, with the
# VoiceDebrief-style pipeline order: validate → tag → publish.
#
#   1. validate     — the same gate release.sh runs locally, including the
#                     key-leak tripwire. A failure stops the release: no tag,
#                     no publish.
#   2. tag-release  — every push to dev is a minor release and ends tagged
#                     v{release}.{major}.{minor}. Adapted from the VoiceDebrief
#                     workflow (OSBot git__increment-tag) with one deliberate
#                     difference: CI does NOT commit a version file, because this
#                     repo is simultaneously an sgit vault and a CI-authored
#                     commit would exist only on the git side, breaking the
#                     both-remotes-in-sync invariant release.sh enforces. The
#                     version already lives in admin/build/build_pages.py
#                     (SITE_VERSION, bumped exactly once per release) and in the
#                     release commit's subject — CI verifies the two agree, that
#                     the bump is the next minor, then tags. First run backfills
#                     tags for every historical release from the commit subjects.
#   3. deploy       — publishes the tagged commit. Runs on manual dispatch even
#                     without a tag, but never when validation failed.
#
# The repo's encrypted .sg_vault store is excluded from the published artifact
# (it is safe to publish by design, but the public site doesn't need it).
name: deploy-pages
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate the site (structure, links, twins, key-leak tripwire)
        # .sg_vault/local is gitignored so the derived-secret scan self-skips in
        # CI; the structural checks and the key-shape pattern ban still run.
        run: node admin/build/validate.js

  tag-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag this release (and backfill any missing historical tags)
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          git config user.name  'GitHub Actions'
          git config user.email 'actions@github.com'

          # Backfill: every release commit carries its version in the subject
          # ("site vR.M.N: ..."). Tag any that are missing — idempotent, so this
          # is a no-op on every run after the first.
          git log --format='%H;%s' | while IFS=';' read -r h s; do
            v=$(printf '%s' "$s" | grep -oP '^site v\K[0-9]+\.[0-9]+\.[0-9]+(?=:)' || true)
            if [ -n "$v" ] && ! git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
              git tag "v$v" "$h"
              echo "backfilled v$v -> ${h:0:9}"
            fi
          done

          # The version of THIS release, from the file that owns it.
          VER=$(grep -oP "SITE_VERSION = 'v\K[0-9]+\.[0-9]+\.[0-9]+" admin/build/build_pages.py)
          TAG="v$VER"
          echo "SITE_VERSION says $TAG"

          # The release commit's subject must agree (release.sh writes both).
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::HEAD's subject does not carry $TAG — SITE_VERSION and the release commit disagree"
            exit 1
          fi
          if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::$TAG already exists on another commit — SITE_VERSION was not bumped for this release"
            exit 1
          fi

          # Every push to dev is a minor: the new tag must be the next minor
          # after the previous latest (or a deliberate major/release bump to .0).
          PREV=$(git tag --list 'v*' | grep -v "^$TAG$" | sort -V | tail -1)
          if [ -n "$PREV" ]; then
            NEXT_MINOR=$(echo "$PREV" | awk -F. '{printf "%s.%s.%d", $1, $2, $3+1}')
            NEXT_MAJOR=$(echo "$PREV" | awk -F. '{split($1,a,"v"); printf "v%s.%d.0", a[2], $2+1}')
            if [ "$TAG" != "$NEXT_MINOR" ] && [ "$TAG" != "$NEXT_MAJOR" ]; then
              echo "::error::latest tag is $PREV; expected $NEXT_MINOR (minor) or $NEXT_MAJOR (major), got $TAG"
              exit 1
            fi
          fi

          # The load-bearing push: THIS release's tag, at HEAD. GITHUB_TOKEN may
          # tag the branch tip (same workflow blob as the branch), so this must
          # succeed — fail the job if it does not.
          git push origin "refs/tags/$TAG"
          echo "tagged HEAD as $TAG"

          # Best-effort: the backfilled historical tags. GITHUB_TOKEN cannot
          # push a ref to a commit whose tree carries a DIFFERENT
          # .github/workflows blob — the `workflows` permission is not grantable
          # to it — so releases predating a workflow change are rejected. Push
          # what is accepted, report what is not; a single
          # `git push origin --tags` from any workflows-scoped human credential
          # completes the set, after which this loop is a chain of no-ops.
          MISSED=0
          for t in $(git tag --list 'v*'); do
            [ "$t" = "$TAG" ] && continue
            if git push origin "refs/tags/$t" >/dev/null 2>&1; then
              echo "backfill ok: $t"
            else
              echo "::warning::could not push backfill tag $t (GITHUB_TOKEN workflow-file limit)"
              MISSED=$((MISSED+1))
            fi
          done
          if [ "$MISSED" -gt 0 ]; then
            echo "::notice::$MISSED historical tag(s) still need a human push: git push origin --tags"
          fi
          true

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, tag-release]
    # Publish even when tag-release is skipped (manual dispatch) — never when
    # validation failed.
    if: always() && needs.validate.result == 'success' && (needs.tag-release.result == 'success' || needs.tag-release.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site artifact
        run: |
          mkdir -p /tmp/site
          rsync -a ./ /tmp/site/ --exclude '.git' --exclude '.github' --exclude '.sg_vault'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - id: deployment
        uses: actions/deploy-pages@v4
